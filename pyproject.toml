[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewmymcp"
version = "0.1.0"
description = "Log-driven MCP server audit and evaluation tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "jsonschema>=4.21",
    "rich>=13.7",
    "jinja2>=3.1",
    "tiktoken>=0.7",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
reviewmymcp = "reviewmymcp.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewmymcp"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
